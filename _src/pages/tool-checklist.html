<div class="page-hero"><div class="container">
  <div class="crumbs"><a href="/">Home</a> / <a href="/tools.html">Tools</a> / Launch Checklist</div>
  <h1>✅ The 0‑1111‑2 Launch Checklist</h1>
  <p>48 practical tasks, eight per stage. Tick them off — progress is saved on this device.</p>
</div></div>
<section><div class="container">
  <div class="card" style="position:sticky;top:76px;z-index:5">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
      <div><span class="big" id="clPct" style="font-size:2rem">0%</span> <span class="muted" id="clCount"></span></div>
      <div><button class="btn btn-ghost btn-sm" id="clPrint" type="button">🖨 Print</button> <button class="btn btn-ghost btn-sm" id="clReset" type="button">Reset</button></div>
    </div>
    <div class="meter"><i id="clMeter"></i></div>
  </div>
  <div class="grid g2 mt2">
    <div class="card"><h3><span class="stage-num" style="font-size:1.4rem;color:var(--dim)">0</span> Zero — Idea</h3><ul class="checklist">
      <li><label><input type="checkbox">Write a one-sentence problem statement in the customer's words</label></li>
      <li><label><input type="checkbox">Name a specific customer segment</label></li>
      <li><label><input type="checkbox">List how they solve the problem today</label></li>
      <li><label><input type="checkbox">Score the idea with the Idea Score tool</label></li>
      <li><label><input type="checkbox">Identify your unfair advantage</label></li>
      <li><label><input type="checkbox">Shortlist 5 names and check domains</label></li>
      <li><label><input type="checkbox">Search trademarks for your top name</label></li>
      <li><label><input type="checkbox">Set a 30-day validation deadline</label></li></ul></div>
    <div class="card"><h3><span class="stage-num" style="font-size:1.4rem">1</span> Validate</h3><ul class="checklist">
      <li><label><input type="checkbox">Hold 10+ customer interviews about past behaviour</label></li>
      <li><label><input type="checkbox">Record exact phrases customers use</label></li>
      <li><label><input type="checkbox">Publish a one-page smoke-test site</label></li>
      <li><label><input type="checkbox">Add an email capture or pre-order button</label></li>
      <li><label><input type="checkbox">Drive 200+ targeted visitors to the page</label></li>
      <li><label><input type="checkbox">Measure visitor-to-signup conversion</label></li>
      <li><label><input type="checkbox">Collect at least 3 pre-sales or deposits</label></li>
      <li><label><input type="checkbox">Decide: build, pivot or stop</label></li></ul></div>
    <div class="card"><h3><span class="stage-num" style="font-size:1.4rem">1</span> Build</h3><ul class="checklist">
      <li><label><input type="checkbox">Define the single core workflow</label></li>
      <li><label><input type="checkbox">Cut scope to ship in 30 days or less</label></li>
      <li><label><input type="checkbox">Set a budget ceiling with the cost calculator</label></li>
      <li><label><input type="checkbox">Choose stack: code, no-code or AI-assisted</label></li>
      <li><label><input type="checkbox">Set up analytics and error tracking</label></li>
      <li><label><input type="checkbox">Write privacy policy and terms</label></li>
      <li><label><input type="checkbox">Onboard validated users as beta testers</label></li>
      <li><label><input type="checkbox">Fix the top 3 friction points from beta</label></li></ul></div>
    <div class="card"><h3><span class="stage-num" style="font-size:1.4rem">1</span> Launch</h3><ul class="checklist">
      <li><label><input type="checkbox">Pick a launch date and calendar moment</label></li>
      <li><label><input type="checkbox">Grow a pre-launch waitlist</label></li>
      <li><label><input type="checkbox">Prepare screenshots, demo video and copy</label></li>
      <li><label><input type="checkbox">Line up 3–5 launch channels and communities</label></li>
      <li><label><input type="checkbox">Brief partners and early fans to share</label></li>
      <li><label><input type="checkbox">Prepare a launch-day offer</label></li>
      <li><label><input type="checkbox">Reply to every comment on launch day</label></li>
      <li><label><input type="checkbox">Send a follow-up sequence to new sign-ups</label></li></ul></div>
    <div class="card"><h3><span class="stage-num" style="font-size:1.4rem">1</span> Earn</h3><ul class="checklist">
      <li><label><input type="checkbox">Set value-based pricing with 2–3 tiers</label></li>
      <li><label><input type="checkbox">Add an annual plan</label></li>
      <li><label><input type="checkbox">Track MRR, churn and LTV monthly</label></li>
      <li><label><input type="checkbox">Calculate runway and default-alive status</label></li>
      <li><label><input type="checkbox">Interview every churned customer</label></li>
      <li><label><input type="checkbox">Collect testimonials and case studies</label></li>
      <li><label><input type="checkbox">Test one price increase</label></li>
      <li><label><input type="checkbox">Set up bookkeeping and tax reserves</label></li></ul></div>
    <div class="card"><h3><span class="stage-num" style="font-size:1.4rem;color:var(--violet)">2</span> Scale</h3><ul class="checklist">
      <li><label><input type="checkbox">Document your acquisition playbook</label></li>
      <li><label><input type="checkbox">Add a second acquisition channel</label></li>
      <li><label><input type="checkbox">Launch a referral or partner program</label></li>
      <li><label><input type="checkbox">Hire or contract for your biggest bottleneck</label></li>
      <li><label><input type="checkbox">Automate repetitive work with AI</label></li>
      <li><label><input type="checkbox">Explore a second product or market</label></li>
      <li><label><input type="checkbox">Review unit economics quarterly</label></li>
      <li><label><input type="checkbox">Decide on funding: bootstrap, revenue-based or equity</label></li></ul></div>
  </div>
  <div class="ad-zone" data-slot="footer"></div>
  {{TOOL_LEAD:checklist}}
</div></section>
